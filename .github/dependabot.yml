# Dependabot version updates. Dependabot alerts and security updates are
# switched on separately, under the repository's Settings > Code security.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Minor and patch updates arrive together in one pull request; each major
    # update (a new Electron version, for example) gets its own.
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  # The actions used by the release workflow.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
